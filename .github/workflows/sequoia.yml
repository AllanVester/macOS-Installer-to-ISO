name: Build macOS Sequoia ISO (24A335)

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: "${{ github.workspace }}/"

      - name: Checkout PKG branch
        uses: actions/checkout@v6
        with:
          repository: "${{ github.repository_owner }}/MacOS-Sequoia-24A335"
          ref: "PKG"
          path: "${{ github.workspace }}/PKG"
          token: "${{ secrets.PAT }}"

      - name: Checkout ISO branch
        uses: actions/checkout@v6
        with:
          repository: "${{ github.repository_owner }}/MacOS-Sequoia-24A335"
          ref: "ISO"
          path: "${{ github.workspace }}/ISO"
          token: "${{ secrets.PAT }}"

      - name: Set up Git
        run: |
          gh auth login --with-token <<< "${{ secrets.PAT }}"

          git config --global user.name "AllanVester"
          git config --global user.email "vesterallan246@gmail.com"
          git config --global http.postBuffer 104857600

      - name: Free up disk space (Attempt)
        run: |
          # This helps slightly on standard runners, but usually isn't enough for this task
          sudo rm -rf /Users/runner/Library/Android/sdk
          sudo rm -rf /Library/Developer/CommandLineTools
          df -h

      - name: Download macOS Sequoia Installer 
        run: |
          until curl -f -L -C - -o ${{ github.workspace }}/InstallAssistant.pkg "https://archive.org/download/macOS-24A335-InstallAssistant/InstallAssistant.pkg"; do
            echo "Download failed or interrupted. Retrying in 5 seconds..."
            sleep 5
          done

      - name: Split PKG into 100MB chunks
        run: |
          split -a 3 -b 100m -d ${{ github.workspace }}/InstallAssistant.pkg ${{ github.workspace }}/PKG/Sequoia.pkg.part

      - name: Upload PKG to GitHub
        working-directory: "${{ github.workspace }}/PKG/"
        run: |
          for file in Sequoia.pkg.part*; do
              git add "$file"
              git commit -m "Uploaded $file"
              git push
          done

      - name: Split PKG directory
        run: |
          rm -rf ${{ github.workspace }}/PKG

      - name: Install the Installer App
        run: |
          echo "Installing package..."
          sudo installer -pkg ${{ github.workspace }}/InstallAssistant.pkg -target /
          
          # Verify it exists
          ls -d /Applications/Install\ macOS\ Sequoia*.app

          # Delete the pkg to save space immediately
          rm ${{ github.workspace }}/InstallAssistant.pkg

      - name: Create and Mount Disk Image
        run: |
          echo "Creating empty disk image..."
          # Use a sparse image to save space until it's filled
          hdiutil create -o /tmp/Sequoia -size 18432m -volname Sequoia -layout SPUD -fs HFS+J
          
          echo "Mounting disk image..."
          hdiutil attach /tmp/Sequoia.dmg -noverify -mountpoint /Volumes/Sequoia

      - name: Create Install Media
        run: |
          echo "Running createinstallmedia (this takes time)..."
          # We use a wildcard (*) because the app name might vary slightly (e.g. "beta")
          INSTALLER_PATH=$(find /Applications -name "Install macOS Sequoia*.app" -maxdepth 1 | head -n 1)
          echo "Found installer at: $INSTALLER_PATH"
          
          sudo "$INSTALLER_PATH/Contents/Resources/createinstallmedia" --volume /Volumes/Sequoia --nointeraction

      - name: Unmount and Convert to ISO
        run: |
          echo "Unmounting..."
          hdiutil detach /Volumes/Install\ macOS\ Sequoia*
          
          echo "Converting to ISO/CDR..."
          hdiutil convert /tmp/Sequoia.dmg -format UDTO -o ${{ github.workspace }}/Sequoia.cdr
          
          echo "Renaming to .iso..."
          mv ${{ github.workspace }}/Sequoia.cdr ${{ github.workspace }}/Sequoia.iso
          
          ls -lh ${{ github.workspace }}/Sequoia.iso

      - name: Split ISO into 100MB chunks
        run: |
          split -a 3 -b 100m -d ${{ github.workspace }}/Sequoia.iso ${{ github.workspace }}/ISO/Sequoia.iso.part

      - name: Upload ISO to GitHub
        working-directory: "${{ github.workspace }}/ISO/"
        run: |
          for file in Sequoia.iso.part*; do
              git add "$file"
              git commit -m "Uploaded $file"
              git push
          done
